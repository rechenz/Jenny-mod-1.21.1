buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.54', changing: false
    }
}

plugins {
    id 'eclipse'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'

group = 'com.schnurritv'
version = '1.8.0-1.21.1'

base {
    archivesName = 'sexmod'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        client {
            source sourceSets.main
        }
        server {
            source sourceSets.main
            args '--nogui'
        }
    }
}

repositories {
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.7'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.21.1:4.6.6')
    // Forge runtime requires jopt-simple 5.x on the module path (6.x has a different
    // Automatic-Module-Name: 'joptsimple' vs the 'jopt.simple' modlauncher expects).
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
}

configurations.configureEach {
    resolutionStrategy {
        force 'net.sf.jopt-simple:jopt-simple:5.0.4'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "sexmod",
                "Specification-Vendor"    : "schnurritv",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "schnurritv",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
